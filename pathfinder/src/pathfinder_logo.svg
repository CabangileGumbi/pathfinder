<svg width="100%" viewBox="0 0 680 340" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Career Guidance System Logo</title>
  <desc>A logo featuring an upward path with milestone nodes, a compass needle, and the text "Pathfinder" with tagline "Career Guidance System"</desc>

  <defs>
    <style>
      .logo-name { font-family: Arial, sans-serif; font-size: 42px; font-weight: 500; fill: #3C3489; }
      .logo-sub  { font-family: Arial, sans-serif; font-size: 16px; font-weight: 400; fill: #7F77DD; letter-spacing: 0.18em; }
    </style>
  </defs>

  <polygon points="170,50 230,50 260,100 230,150 170,150 140,100"
           fill="#EEEDFE" stroke="#AFA9EC" stroke-width="0.5"/>

  <polyline points="155,135  170,108  195,95  218,72"
            fill="none" stroke="#7F77DD" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round"/>

  <circle cx="155" cy="135" r="6" fill="#AFA9EC" stroke="#EEEDFE" stroke-width="2"/>
  <circle cx="195" cy="95"  r="7" fill="#7F77DD" stroke="#EEEDFE" stroke-width="2"/>

  <g transform="translate(218,72)">
    <polygon points="0,-11 3,-4 10,-4 5,1 7,9 0,4 -7,9 -5,1 -10,-4 -3,-4"
             fill="#534AB7" stroke="#EEEDFE" stroke-width="1.2"/>
  </g>

  <circle cx="200" cy="100" r="58" fill="none" stroke="#CCC9F0" stroke-width="0.5" stroke-dasharray="4 4"/>

  <line x1="200" y1="100" x2="218" y2="56"
        stroke="#534AB7" stroke-width="2" stroke-linecap="round"/>
  <line x1="200" y1="100" x2="182" y2="144"
        stroke="#AFA9EC" stroke-width="2" stroke-linecap="round"/>
  <circle cx="200" cy="100" r="4" fill="#534AB7"/>

  <line x1="200" y1="44" x2="200" y2="50" stroke="#7F77DD" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="256" y1="100" x2="250" y2="100" stroke="#AFA9EC" stroke-width="1"  stroke-linecap="round"/>
  <line x1="200" y1="156" x2="200" y2="150" stroke="#AFA9EC" stroke-width="1"  stroke-linecap="round"/>
  <line x1="144" y1="100" x2="150" y2="100" stroke="#AFA9EC" stroke-width="1"  stroke-linecap="round"/>

  <text x="295" y="112" class="logo-name">Pathfinder</text>
  <text x="298" y="143" class="logo-sub">CAREER GUIDANCE SYSTEM</text>

  <line x1="295" y1="160" x2="600" y2="160"
        stroke="#CCC9F0" stroke-width="0.5"/>

  <text x="296" y="182" font-family="Arial, sans-serif" font-size="13" font-weight="400"
        fill="#888780">Navigate your journey. Reach your potential.</text>

</svg>
